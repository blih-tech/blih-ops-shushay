<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Blih - Talent Profile Setup</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;600&family=JetBrains+Mono:wght@400;500&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family='Source+Serif+4',+Georgia,+serif:wght@100..900&family=Inter,+sans-serif:wght@100..900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container": "#ecedf7",
                      "destructive": "#EF4444",
                      "outline-variant": "#c2c6d6",
                      "outline": "#727785",
                      "surface-container-highest": "#e1e2ec",
                      "on-secondary-fixed-variant": "#444749",
                      "dark-border": "#404040",
                      "surface-dim": "#d8d9e3",
                      "secondary-container": "#dee0e2",
                      "on-background": "#191b23",
                      "primary-fixed-dim": "#adc6ff",
                      "secondary": "#5c5f60",
                      "dark-surface": "#171717",
                      "on-primary": "#ffffff",
                      "on-primary-fixed": "#001a42",
                      "surface-variant": "#e1e2ec",
                      "tertiary-fixed-dim": "#ffb786",
                      "on-primary-fixed-variant": "#004395",
                      "on-error": "#ffffff",
                      "on-tertiary-container": "#fffbff",
                      "surface-bright": "#f9f9ff",
                      "accent-blue-soft": "#E0F2FE",
                      "error": "#ba1a1a",
                      "primary-fixed": "#d8e2ff",
                      "surface-container-lowest": "#ffffff",
                      "inverse-surface": "#2e3038",
                      "surface-container-low": "#f2f3fd",
                      "primary": "#0058be",
                      "surface-tint": "#005ac2",
                      "muted-foreground": "#6B7280",
                      "on-tertiary-fixed": "#311400",
                      "accent-blue-deep": "#1E3A8A",
                      "on-secondary": "#ffffff",
                      "inverse-primary": "#adc6ff",
                      "on-surface-variant": "#424754",
                      "tertiary-fixed": "#ffdcc6",
                      "surface": "#f9f9ff",
                      "tertiary-container": "#b75b00",
                      "background": "#f9f9ff",
                      "tertiary": "#924700",
                      "on-secondary-fixed": "#191c1e",
                      "error-container": "#ffdad6",
                      "secondary-fixed-dim": "#c5c6c8",
                      "surface-container-high": "#e6e7f2",
                      "on-error-container": "#93000a",
                      "on-surface": "#191b23",
                      "on-tertiary": "#ffffff",
                      "inverse-on-surface": "#eff0fa",
                      "body-text": "#4B5563",
                      "primary-container": "#2170e4",
                      "on-tertiary-fixed-variant": "#723600",
                      "on-secondary-container": "#606365",
                      "secondary-fixed": "#e1e2e4",
                      "on-primary-container": "#fefcff"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "base": "16px",
                      "2xl": "48px",
                      "section-desktop": "96px",
                      "md": "12px",
                      "section-mobile": "64px",
                      "lg": "24px",
                      "xs": "4px",
                      "xl": "32px",
                      "sm": "8px"
              },
              "fontFamily": {
                      "body-lg": ["\"Inter, sans-serif\""],
                      "body-md": ["\"Inter, sans-serif\""],
                      "display-hero": ["\"'Source Serif 4', Georgia, serif\""],
                      "label": ["\"Inter, sans-serif\""],
                      "technical": ["\"'JetBrains Mono', monospace\""],
                      "heading-card": ["\"'Source Serif 4', Georgia, serif\""],
                      "body-sm": ["\"Inter, sans-serif\""],
                      "button": ["\"Inter, sans-serif\""],
                      "display-section": ["\"'Source Serif 4', Georgia, serif\""]
              },
              "fontSize": {
                      "body-lg": ["18px", {"lineHeight": "1.625", "fontWeight": "400"}],
                      "body-md": ["16px", {"lineHeight": "1.625", "fontWeight": "400"}],
                      "display-hero": ["60px", {"lineHeight": "1", "letterSpacing": "-1.5px", "fontWeight": "600"}],
                      "label": ["12px", {"lineHeight": "1.25", "letterSpacing": "1.2px", "fontWeight": "500"}],
                      "technical": ["12px", {"lineHeight": "1.4", "letterSpacing": "0.6px", "fontWeight": "500"}],
                      "heading-card": ["18px", {"lineHeight": "1.3", "letterSpacing": "-0.2px", "fontWeight": "600"}],
                      "body-sm": ["14px", {"lineHeight": "1.625", "fontWeight": "400"}],
                      "button": ["14px", {"lineHeight": "1", "fontWeight": "500"}],
                      "display-section": ["48px", {"lineHeight": "1.05", "letterSpacing": "-1.2px", "fontWeight": "600"}]
              }
            }
          }
        }
    </script>
<style>
        body {
            background-color: #F9FAFB;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="text-on-surface font-body-md min-h-screen flex flex-col">
<!-- Content Canvas - Wizard Layout -->
<main class="flex-grow flex flex-col pt-2xl pb-section-desktop px-4 sm:px-lg max-w-5xl mx-auto w-full gap-lg">
<!-- Header area (Minimal) -->
<header class="mb-xl flex items-center justify-between">
<div class="font-display-section text-heading-card font-semibold text-primary">Blih</div>
<a class="text-on-surface-variant hover:text-primary transition-colors font-button text-button flex items-center gap-xs" href="#">
                Save & Exit
                <span class="material-symbols-outlined text-[16px]">logout</span>
</a>
</header>
<!-- Main Wizard Container -->
<div class="grid grid-cols-1 md:grid-cols-12 gap-xl relative">
<!-- Left Sidebar: Progress Navigation -->
<aside class="md:col-span-4 lg:col-span-3 h-fit sticky top-2xl">
<nav aria-label="Progress">
<ol class="overflow-hidden" role="list">
<!-- Step 1: Completed -->
<li class="relative pb-10">
<div aria-hidden="true" class="absolute top-4 left-4 -ml-px h-full w-0.5 bg-primary"></div>
<a class="relative flex items-start group" href="#">
<span class="h-9 flex items-center">
<span class="relative z-10 w-8 h-8 flex items-center justify-center bg-primary rounded-full group-hover:bg-primary-container transition-colors">
<span class="material-symbols-outlined text-on-primary text-[16px] font-bold" data-weight="fill">check</span>
</span>
</span>
<span class="ml-4 min-w-0 flex flex-col">
<span class="text-label font-label text-primary uppercase tracking-wider">Step 1</span>
<span class="text-body-sm font-medium text-on-surface">Personal Info</span>
</span>
</a>
</li>
<!-- Step 2: Current -->
<li class="relative pb-10">
<div aria-hidden="true" class="absolute top-4 left-4 -ml-px h-full w-0.5 bg-outline-variant"></div>
<a aria-current="step" class="relative flex items-start group" href="#">
<span aria-hidden="true" class="h-9 flex items-center">
<span class="relative z-10 w-8 h-8 flex items-center justify-center bg-surface-container-lowest border-2 border-primary rounded-full">
<span class="w-2.5 h-2.5 bg-primary rounded-full"></span>
</span>
</span>
<span class="ml-4 min-w-0 flex flex-col">
<span class="text-label font-label text-primary uppercase tracking-wider">Step 2</span>
<span class="text-body-sm font-medium text-on-surface">Expertise</span>
</span>
</a>
</li>
<!-- Step 3: Upcoming -->
<li class="relative pb-10">
<div aria-hidden="true" class="absolute top-4 left-4 -ml-px h-full w-0.5 bg-outline-variant"></div>
<a class="relative flex items-start group" href="#">
<span aria-hidden="true" class="h-9 flex items-center">
<span class="relative z-10 w-8 h-8 flex items-center justify-center bg-surface-container-lowest border-2 border-outline-variant rounded-full group-hover:border-outline transition-colors">
<span class="h-2.5 w-2.5 bg-transparent rounded-full group-hover:bg-outline-variant transition-colors"></span>
</span>
</span>
<span class="ml-4 min-w-0 flex flex-col">
<span class="text-label font-label text-on-surface-variant uppercase tracking-wider">Step 3</span>
<span class="text-body-sm font-medium text-on-surface-variant">Professional History</span>
</span>
</a>
</li>
<!-- Step 4: Upcoming -->
<li class="relative">
<a class="relative flex items-start group" href="#">
<span aria-hidden="true" class="h-9 flex items-center">
<span class="relative z-10 w-8 h-8 flex items-center justify-center bg-surface-container-lowest border-2 border-outline-variant rounded-full group-hover:border-outline transition-colors">
<span class="h-2.5 w-2.5 bg-transparent rounded-full group-hover:bg-outline-variant transition-colors"></span>
</span>
</span>
<span class="ml-4 min-w-0 flex flex-col">
<span class="text-label font-label text-on-surface-variant uppercase tracking-wider">Step 4</span>
<span class="text-body-sm font-medium text-on-surface-variant">Document Upload</span>
</span>
</a>
</li>
</ol>
</nav>
</aside>
<!-- Right Area: Form Content -->
<div class="md:col-span-8 lg:col-span-9">
<div class="bg-surface-container-lowest border border-outline-variant rounded p-lg sm:p-xl shadow-sm">
<div class="mb-xl border-b border-outline-variant pb-md">
<h1 class="font-heading-card text-heading-card text-on-surface">Define Your Expertise</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-sm">Select the skills and languages that best represent your professional capabilities to potential employers.</p>
</div>
<form action="#" class="space-y-xl" method="POST">
<!-- Skills Section -->
<div class="space-y-md">
<div>
<label class="block font-label text-label text-on-surface uppercase tracking-wider" for="primary-skill">Primary Role</label>
<div class="mt-xs relative">
<select class="block w-full border-outline-variant rounded-[4.8px] shadow-sm focus:ring-primary focus:border-primary font-body-sm text-body-sm h-10 px-sm bg-surface-bright" id="primary-skill" name="primary-skill">
<option>Software Engineering</option>
<option>Product Design</option>
<option>Data Science</option>
<option>Marketing</option>
</select>
</div>
</div>
<div>
<label class="block font-label text-label text-on-surface uppercase tracking-wider" for="skills">Core Skills</label>
<div class="mt-xs">
<input class="block w-full border-outline-variant rounded-[4.8px] shadow-sm focus:ring-primary focus:border-primary font-body-sm text-body-sm h-10 px-sm placeholder:text-muted-foreground bg-surface-bright" id="skills" name="skills" placeholder="e.g. React, Python, Figma (Press Enter to add)" type="text"/>
</div>
<!-- Skill Chips -->
<div class="mt-sm flex flex-wrap gap-sm">
<span class="inline-flex items-center gap-xs px-2 py-1 rounded bg-surface-container border border-outline-variant text-technical font-technical text-on-surface">
                                        React
                                        <button class="text-on-surface-variant hover:text-destructive focus:outline-none" type="button">
<span class="material-symbols-outlined text-[14px]">close</span>
</button>
</span>
<span class="inline-flex items-center gap-xs px-2 py-1 rounded bg-surface-container border border-outline-variant text-technical font-technical text-on-surface">
                                        TypeScript
                                        <button class="text-on-surface-variant hover:text-destructive focus:outline-none" type="button">
<span class="material-symbols-outlined text-[14px]">close</span>
</button>
</span>
<span class="inline-flex items-center gap-xs px-2 py-1 rounded bg-surface-container border border-outline-variant text-technical font-technical text-on-surface">
                                        Node.js
                                        <button class="text-on-surface-variant hover:text-destructive focus:outline-none" type="button">
<span class="material-symbols-outlined text-[14px]">close</span>
</button>
</span>
</div>
</div>
</div>
<!-- Language Proficiency -->
<div class="space-y-md">
<label class="block font-label text-label text-on-surface uppercase tracking-wider">English Proficiency</label>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-sm">
<!-- Option 1 -->
<label class="relative flex cursor-pointer rounded-[4.8px] border border-outline-variant bg-surface-container-lowest p-md hover:bg-surface-container-low focus:outline-none">
<input aria-labelledby="english-basic-label" class="sr-only" name="english_level" type="radio" value="basic"/>
<span class="flex flex-1">
<span class="flex flex-col">
<span class="block font-body-sm text-body-sm font-medium text-on-surface" id="english-basic-label">Basic (A1-A2)</span>
<span class="mt-1 flex items-center text-body-sm font-body-sm text-on-surface-variant">Limited working proficiency.</span>
</span>
</span>
<span aria-hidden="true" class="material-symbols-outlined text-outline-variant">radio_button_unchecked</span>
</label>
<!-- Option 2 -->
<label class="relative flex cursor-pointer rounded-[4.8px] border border-outline-variant bg-surface-container-lowest p-md hover:bg-surface-container-low focus:outline-none">
<input aria-labelledby="english-intermediate-label" class="sr-only" name="english_level" type="radio" value="intermediate"/>
<span class="flex flex-1">
<span class="flex flex-col">
<span class="block font-body-sm text-body-sm font-medium text-on-surface" id="english-intermediate-label">Intermediate (B1-B2)</span>
<span class="mt-1 flex items-center text-body-sm font-body-sm text-on-surface-variant">Professional working proficiency.</span>
</span>
</span>
<span aria-hidden="true" class="material-symbols-outlined text-outline-variant">radio_button_unchecked</span>
</label>
<!-- Option 3 (Selected) -->
<label class="relative flex cursor-pointer rounded-[4.8px] border border-primary bg-accent-blue-soft p-md focus:outline-none">
<input aria-labelledby="english-fluent-label" checked="" class="sr-only" name="english_level" type="radio" value="fluent"/>
<span class="flex flex-1">
<span class="flex flex-col">
<span class="block font-body-sm text-body-sm font-medium text-on-primary-fixed" id="english-fluent-label">Fluent (C1-C2)</span>
<span class="mt-1 flex items-center text-body-sm font-body-sm text-on-surface-variant">Native or bilingual proficiency.</span>
</span>
</span>
<span aria-hidden="true" class="material-symbols-outlined text-primary" data-weight="fill">radio_button_checked</span>
</label>
</div>
</div>
<!-- Action Buttons -->
<div class="mt-xl pt-lg border-t border-outline-variant flex items-center justify-between">
<button class="inline-flex items-center gap-xs text-button font-button font-medium text-on-surface-variant hover:text-on-surface transition-colors px-base py-sm border border-outline-variant rounded" type="button">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
                                Back
                            </button>
<button class="inline-flex items-center gap-xs bg-primary text-on-primary font-button text-button h-10 px-lg rounded hover:bg-primary-container transition-all duration-300 shadow-sm" type="submit">
                                Continue
                                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
</div>
</div>
</div>
</main>
<!-- Optional subtle background grid effect to reinforce structure -->
<div class="fixed inset-0 pointer-events-none z-[-1]" style="background-size: 24px 24px; background-image: linear-gradient(to right, #E5E7EB 1px, transparent 1px), linear-gradient(to bottom, #E5E7EB 1px, transparent 1px); opacity: 0.3;"></div>
</body></html>
