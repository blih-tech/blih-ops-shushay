<style>
        .hairline-grid {
            background-image: 
                linear-gradient(to right, #E5E7EB 1px, transparent 1px),

<body class="bg-surface-bright text-on-surface min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Ambient Grid Background -->
<div class="absolute inset-0 hairline-grid opacity-30 z-0"></div>
<div class="relative z-10 w-full max-w-md px-lg py-2xl">
<!-- Logo -->
<div class="text-center mb-xl">
<h1 class="font-display-section text-display-section font-bold text-primary">Blih</h1>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-outline-variant p-lg md:p-2xl shadow-sm rounded-DEFAULT transition-all duration-500 hover:shadow-md">
<div class="text-center mb-xl">
<h2 class="font-display-hero text-[32px] md:text-[40px] text-on-surface mb-sm">Welcome back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Please enter your details to sign in.</p>
</div>
<form action="#" class="space-y-base" method="POST">
<!-- Email Input -->
<div>
<label class="block font-label text-label text-on-surface mb-xs" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute inset-y-0 left-0 flex items-center pl-sm text-outline-variant pointer-events-none" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="block w-full pl-xl pr-sm py-sm border border-outline-variant rounded-[4.8px] bg-transparent font-body-sm text-body-sm text-on-surface focus:ring-1 focus:ring-primary focus:border-primary transition-colors" id="email" name="email" placeholder="Enter your email" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div>
<label class="block font-label text-label text-on-surface mb-xs" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute inset-y-0 left-0 flex items-center pl-sm text-outline-variant pointer-events-none" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="block w-full pl-xl pr-sm py-sm border border-outline-variant rounded-[4.8px] bg-transparent font-body-sm text-body-sm text-on-surface focus:ring-1 focus:ring-primary focus:border-primary transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Options -->
<div class="flex items-center justify-between pt-sm">
<div class="flex items-center">
<input class="h-4 w-4 rounded-[4px] border-outline-variant text-primary focus:ring-primary bg-transparent" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-sm block font-body-sm text-body-sm text-on-surface-variant" for="remember-me">
                            Remember me
                        </label>
</div>
<div class="text-sm">
<a class="font-body-sm text-body-sm text-primary hover:text-accent-blue-deep transition-colors" href="#">
                            Forgot password?
                        </a>
</div>
</div>
<!-- Submit Button -->
<div class="pt-md">
<button class="w-full flex justify-center py-[13px] px-base border border-transparent rounded-DEFAULT shadow-sm font-button text-button text-on-primary bg-primary hover:bg-accent-blue-deep focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-300" type="submit">
                        Sign In
                    </button>
</div>
</form>
</div>
<!-- Sign Up Link -->
<div class="mt-lg text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Don't have an account? 
                <a class="font-body-sm text-body-sm text-primary font-medium hover:text-accent-blue-deep transition-colors" href="#">Sign up</a>
</p>
</div>
</div>
