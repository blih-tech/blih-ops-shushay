<body class="bg-background text-on-background font-body-md min-h-screen flex items-center justify-center py-section-desktop">
<main class="w-full max-w-[600px] px-lg">
<!-- Header -->
<div class="text-center mb-xl">
<h1 class="font-display-hero text-display-hero text-primary mb-md">Blih</h1>
<p class="font-body-lg text-body-lg text-muted-foreground">Join the remote ecosystem.</p>
</div>
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-2xl">
<!-- Step 1: Role Selection -->
<div class="space-y-lg transition-opacity duration-300" id="role-selection">
<h2 class="font-heading-card text-heading-card text-on-surface mb-base text-center">Select your role to begin</h2>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-base">
<!-- Talent Card -->
<label class="cursor-pointer relative group">
<input class="peer sr-only" name="role" type="radio" value="talent"/>
<div class="h-full border border-outline-variant bg-surface rounded-xl p-lg flex flex-col items-center text-center transition-all duration-300 peer-checked:border-primary peer-checked:ring-1 peer-checked:ring-primary hover:border-primary-fixed">
<span class="material-symbols-outlined text-[32px] text-primary mb-md group-hover:scale-110 transition-transform">person</span>
<h3 class="font-heading-card text-heading-card text-on-surface mb-xs">I am a Talent</h3>
<p class="font-body-sm text-body-sm text-muted-foreground">Find remote opportunities and courses.</p>
</div>
</label>
<!-- Company Card -->
<label class="cursor-pointer relative group">
<input class="peer sr-only" name="role" type="radio" value="company"/>
<div class="h-full border border-outline-variant bg-surface rounded-xl p-lg flex flex-col items-center text-center transition-all duration-300 peer-checked:border-primary peer-checked:ring-1 peer-checked:ring-primary hover:border-primary-fixed">
<span class="material-symbols-outlined text-[32px] text-primary mb-md group-hover:scale-110 transition-transform">domain</span>
<h3 class="font-heading-card text-heading-card text-on-surface mb-xs">I am a Company</h3>
<p class="font-body-sm text-body-sm text-muted-foreground">Hire top talent and manage operations.</p>
</div>
</label>
</div>
<!-- Divider -->
<div class="h-px w-full bg-outline-variant my-xl"></div>
<!-- Registration Form Fields -->
<form class="space-y-base">
<div>
<label class="block font-label text-label text-on-surface-variant mb-xs" for="fullName">Full Name</label>
<input class="w-full h-[40px] px-md rounded-DEFAULT border border-outline-variant bg-surface-container-lowest font-body-sm text-body-sm text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="fullName" placeholder="Jane Doe" type="text"/>
</div>
<div>
<label class="block font-label text-label text-on-surface-variant mb-xs" for="email">Email Address</label>
<input class="w-full h-[40px] px-md rounded-DEFAULT border border-outline-variant bg-surface-container-lowest font-body-sm text-body-sm text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="email" placeholder="jane@example.com" type="email"/>
</div>
<div>
<label class="block font-label text-label text-on-surface-variant mb-xs" for="password">Password</label>
<input class="w-full h-[40px] px-md rounded-DEFAULT border border-outline-variant bg-surface-container-lowest font-body-sm text-body-sm text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="password" placeholder="••••••••" type="password"/>
</div>
<button class="w-full h-[40px] bg-primary text-on-primary font-button text-button rounded-DEFAULT mt-lg hover:bg-primary-fixed-dim transition-colors duration-300" type="button">
                        Create Account
                    </button>
<div class="text-center mt-base">
<span class="font-body-sm text-body-sm text-muted-foreground">Already have an account? </span>
<a class="font-body-sm text-body-sm text-primary hover:underline" href="#">Log in</a>
</div>
</form>
</div>
</div>
