name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"

jobs:
  # ── Lint & Typecheck ──────────────────────────────────────────────────────────
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck API
        run: pnpm --filter @blih/api typecheck

      - name: Typecheck Web
        run: pnpm --filter @blih/web typecheck

      - name: Lint Web
        run: pnpm --filter @blih/web lint

  # ── Backend Jest Tests ────────────────────────────────────────────────────────
  test-api:
    name: API Tests (Jest)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://blih:blih@localhost:5432/blih_test
      JWT_SECRET: ci-test-jwt-secret-do-not-use-in-production
      CLOUDINARY_CLOUD_NAME: test-cloud
      CLOUDINARY_API_KEY: test-key
      CLOUDINARY_API_SECRET: test-secret
      CHAPA_SECRET_KEY: mock-secret-key
      REDIS_URL: redis://localhost:6379
      SKIP_EMAIL_VERIFICATION: "true"
      JUDGE0_API_KEY: ""

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blih
          POSTGRES_PASSWORD: blih
          POSTGRES_DB: blih_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @blih/api prisma:generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run Jest tests
        run: pnpm --filter @blih/api test --passWithNoTests --forceExit --testTimeout=30000
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

  # ── Prisma Schema Migration Dry Run ──────────────────────────────────────────
  prisma-validate:
    name: Prisma Schema Validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blih
          POSTGRES_PASSWORD: blih
          POSTGRES_DB: blih_validate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm --filter @blih/api exec prisma validate
        env:
          DATABASE_URL: postgresql://blih:blih@localhost:5432/blih_validate

      - name: Prisma migration dry run
        run: |
          pnpm --filter @blih/api exec prisma migrate deploy --preview-feature 2>&1 || true
          pnpm --filter @blih/api exec prisma db push --accept-data-loss --skip-generate 2>&1 | head -50
        env:
          DATABASE_URL: postgresql://blih:blih@localhost:5432/blih_validate

  # ── Build Check ───────────────────────────────────────────────────────────────
  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API (tsc)
        run: pnpm --filter @blih/api build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          JWT_SECRET: ci-build-placeholder
          CLOUDINARY_CLOUD_NAME: placeholder
          CLOUDINARY_API_KEY: placeholder
          CLOUDINARY_API_SECRET: placeholder

      - name: Build Web (Next.js)
        run: pnpm --filter @blih/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
